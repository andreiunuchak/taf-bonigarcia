name: Prod Java Selenium Allure Tests

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: 'maven'
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Build Project
        run: mvn clean package -DskipTests

  test:
    needs: build
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: write
      pages: write
      id-token: write
    services:
      selenium:
        image: selenium/standalone-chrome:latest
        options: --shm-size 2g
        ports:
          - 4444:4444
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: 'maven'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Allure CLI
        run: npm install -g allure-commandline --unsafe-perm=true
      - name: Run Maven Tests with Allure
        env:
          SELENIUM_REMOTE_URL: http://localhost:4444/wd/hub
        run: mvn clean test
      - name: Check Test Failure Percentage
        run: |
          TOTAL=$(grep -r "testsuite" target/surefire-reports/*.xml | sed -n 's/.*tests="\([^"]*\)".*/\1/p' | awk '{s+=$1} END {print s}')
          FAILURES=$(grep -r "testsuite" target/surefire-reports/*.xml | sed -n 's/.*failures="\([^"]*\)".*/\1/p' | awk '{s+=$1} END {print s}')
          ERRORS=$(grep -r "testsuite" target/surefire-reports/*.xml | sed -n 's/.*errors="\([^"]*\)".*/\1/p' | awk '{s+=$1} END {print s}')
          TOTAL_FAILED=$((FAILURES + ERRORS))
          if [ "$TOTAL" -eq 0 ]; then
            echo "No tests found."
            exit 1
          fi
          PERCENT=$((TOTAL_FAILED * 100 / TOTAL))
          echo "Total tests: $TOTAL"
          echo "Failed tests: $TOTAL_FAILED"
          echo "Failure percentage: $PERCENT%"
          if [ "$PERCENT" -gt 10 ]; then
            echo "Failure rate is above 10%. Failing build."
            exit 1
          fi
      - name: Upload Allure Results as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results
      - name: Generate Allure Report
        if: always()
        run: allure generate --clean target/allure-results -o target/allure-report
      - name: Upload Allure Report as Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report
